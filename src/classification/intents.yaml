# intent taxonomy for AppleSupport
# ============================================================
# Version: 2.0
# Selected Brand: AppleSupport
#
# Design principles:
#   - Grounded in empirical exploration of 82,101 candidate customer tweets.
#   - Clear definitions with explicit inclusion and exclusion rules to minimize overlap.
#   - Every intent is mutually exclusive at the primary level.
#   - The "unknown_other" intent acts as a mandatory fallback.
#   - "auto_handle": Candidate for automated response or self-service retrieval.
#   - "escalation_risk": Requires human agent escalation (billing, account lock, physical damage).
#
# Loading: use src/classification/intent_loader.py
# ============================================================

intents:

  - name: software_update
    display_name: "Software / OS Update Issue"
    definition: >
      The customer reports a problem that started after, or is directly related
      to, a software update, iOS version, macOS version, or system bug.
      Includes performance degradation, bugs introduced by updates (e.g. keyboard
      autocorrect glitches), failed installations, and questions about upcoming bug fixes.
    inclusion_criteria:
      - Mentions "update", "iOS", "iOS11", "macOS", "High Sierra", "upgrade", "glitch", "bug"
      - Problem started immediately after installing an update
      - Asks when an update or patch will be released
    exclusion_criteria:
      - Physical hardware defect not caused by software (→ device_hardware)
      - Battery-only drain complaints without mention of software update (→ battery_power)
      - Cannot sign in after update (→ account_access)
    auto_handle: true
    escalation_risk: false
    examples:
      - "ever since the new iOS 11 update my phone has been freezing constantly"
      - "why is the letter i turning into an A with a question mark square on my iPhone"
      - "High Sierra install failed and now my MacBook Pro won't boot"

  - name: battery_power
    display_name: "Battery, Power & Charging"
    definition: >
      The customer reports battery performance problems, unusually fast battery
      drain, phone overheating during use or charging, battery percentage jumping,
      or charging cable / power adapter failure.
    inclusion_criteria:
      - Mentions "battery", "drain", "draining", "overheating", "charging", "charger", "percentage"
      - Battery life dropping drastically in short periods
      - Device hot to the touch or not charging past a certain percentage
    exclusion_criteria:
      - System-wide software glitch where battery is secondary (→ software_update)
      - Device physically bloated or expanding battery (→ device_hardware)
    auto_handle: true
    escalation_risk: false
    examples:
      - "my iPhone 7 battery drops from 80% to 20% in an hour without use"
      - "my phone gets extremely hot whenever I plug it into the charger"
      - "battery percentage jumps all over the place and shuts down at 30%"

  - name: device_hardware
    display_name: "Device Hardware & Physical Damage"
    definition: >
      The customer reports physical damage, screen defects, touch unresponsiveness,
      camera malfunction, speaker or microphone failure, button damage, or
      hardware components not functioning.
    inclusion_criteria:
      - Mentions "screen", "cracked", "display", "touch screen", "camera", "speaker", "microphone", "mic", "button", "water damage", "liquid"
      - Touch display not responding to input
      - Hardware components physically broken or failing diagnostics
    exclusion_criteria:
      - Touch/app freezing due to software crash (→ app_or_service_issue or software_update)
      - Charging port issue where cable or battery is the primary focus (→ battery_power)
    auto_handle: false
    escalation_risk: true
    examples:
      - "dropped my phone and the screen is cracked and touch isn't working"
      - "the front camera on my iPhone shows a completely black screen"
      - "my speaker is crackling and people can't hear me on calls"

  - name: app_or_service_issue
    display_name: "Native App or Apple Service Issue"
    definition: >
      The customer reports a problem with a specific native Apple application
      or service, including Apple Music, iMessage, FaceTime, Safari, Photos,
      App Store, Mail, Maps, Siri, or CarPlay.
    inclusion_criteria:
      - Names a specific Apple app: iMessage, FaceTime, Apple Music, Safari, Siri, App Store, Photos, Notes, CarPlay, AirDrop
      - App crashes, fails to load content, or cannot sync media
      - Specific app notifications or features failing
    exclusion_criteria:
      - Third-party app external bugs with no Apple relation (→ unknown_other)
      - Account credential errors preventing login (→ account_access)
    auto_handle: true
    escalation_risk: false
    examples:
      - "Apple Music keeps pausing and skipping songs on its own"
      - "iMessage is not delivering text messages to my contacts"
      - "FaceTime hangs on connecting whenever I call my family"

  - name: account_access
    display_name: "Account, iCloud & Security"
    definition: >
      The customer cannot sign in to their Apple ID, iCloud, or iTunes account.
      Includes forgotten passwords, two-factor authentication (2FA) verification
      failures, accounts locked or disabled for security reasons, and Keychain sync.
    inclusion_criteria:
      - Mentions "Apple ID", "iCloud", "password", "sign in", "login", "locked", "disabled", "verification code", "2FA", "two-factor"
      - Account suspended or security questions locked
      - Cannot receive verification SMS or code on trusted device
    exclusion_criteria:
      - Third-party website or app password issues (→ unknown_other)
      - Device activation lock for second-hand purchases (→ device_hardware or account_access)
    auto_handle: false
    escalation_risk: true
    examples:
      - "my Apple ID has been locked for security reasons and I can't reset my password"
      - "I'm not getting the verification code sent to my trusted number"
      - "forgot my iCloud password and the recovery email is old"

  - name: connectivity_network
    display_name: "Connectivity & Network"
    definition: >
      The customer reports problems connecting to Wi-Fi networks, Bluetooth
      devices (e.g. AirPods, car systems), cellular mobile data / LTE,
      dropped calls, No Service alerts, or SIM card recognition errors.
    inclusion_criteria:
      - Mentions "wifi", "wi-fi", "bluetooth", "cellular", "data", "lte", "no service", "sim card", "carrier", "dropped calls"
      - Bluetooth device repeatedly disconnecting
      - iPhone says 'Searching...' or 'No Service'
    exclusion_criteria:
      - App-specific streaming disconnection (→ app_or_service_issue)
      - Physical SIM tray damage (→ device_hardware)
    auto_handle: true
    escalation_risk: false
    examples:
      - "my iPhone keeps disconnecting from home Wi-Fi every 5 minutes"
      - "my phone says No Service even though my carrier network is fine"
      - "Bluetooth won't pair with my AirPods after restarting"

  - name: billing_payment
    display_name: "Billing, Subscriptions & Payments"
    definition: >
      The customer inquires about unexpected charges, subscription fees,
      in-app purchases, App Store receipts, refund requests, or Apple Pay errors.
    inclusion_criteria:
      - Mentions "billing", "charge", "charged", "refund", "subscription", "receipt", "purchase", "apple pay", "credit card", "bank"
      - Dispute over recurring monthly subscription charges
      - Requesting refund for accidental in-app purchase
    exclusion_criteria:
      - Inability to download free apps due to account lock (→ account_access)
      - Hardware warranty claims without payment dispute (→ device_hardware)
    auto_handle: false
    escalation_risk: true
    examples:
      - "I was charged $9.99 for Apple Music even though I cancelled my trial"
      - "how do I request a refund for an accidental purchase in the App Store"
      - "Apple Pay declined my card at checkout but the charge shows pending"

  - name: order_shipping
    display_name: "Online Orders, Shipping & Delivery"
    definition: >
      The customer inquires about the status, tracking, shipping delay, delivery,
      or in-store pickup of a physical order placed through the Apple Online Store.
    inclusion_criteria:
      - Mentions "order", "shipping", "delivery", "delivered", "tracking", "fedex", "ups", "store pickup", "dispatch"
      - Asking when their new iPhone or MacBook will arrive
      - Shipment delayed or tracking number not updating
    exclusion_criteria:
      - App Store digital order disputes (→ billing_payment)
      - Defective device received (→ device_hardware)
    auto_handle: true
    escalation_risk: false
    examples:
      - "my iPhone X order has been preparing for shipment for 5 days — when does it ship"
      - "tracking number says delivered but my package was not on my porch"
      - "can I change my delivery address for order W12345678"

  - name: feature_how_to
    display_name: "Feature Question & How-To"
    definition: >
      The customer asks how to use, configure, or find a feature, setting,
      or capability in an Apple product without reporting a technical malfunction.
    inclusion_criteria:
      - Starts with "how do I", "how can I", "is there a way to", "can you tell me how"
      - Seeking instructions or configuration guidance
      - Inquiring whether a specific feature exists
    exclusion_criteria:
      - The feature is broken or throwing errors (→ app_or_service_issue or software_update)
      - Feature request for non-existent future software (→ complaint_feedback)
    auto_handle: true
    escalation_risk: false
    examples:
      - "how do I turn off read receipts in iMessage for one specific person"
      - "is there a way to record the screen on iOS without third party apps"
      - "how can I transfer photos from my iPhone to a Windows PC"

  - name: complaint_feedback
    display_name: "Complaint & Product Feedback"
    definition: >
      The customer expresses general frustration, dissatisfaction, or feedback
      regarding Apple devices, design decisions, customer service, or policies,
      without asking a specific technical support question.
    inclusion_criteria:
      - Strong negative sentiment expressions ("fix your shit", "worst phone", "hate this company", "ridiculous")
      - Complaints about Apple removing features (e.g. headphone jack)
      - General venting without actionable technical query
    exclusion_criteria:
      - Actionable technical issue with details (→ software_update, battery_power, etc.)
      - Billing dispute with refund demand (→ billing_payment)
    auto_handle: false
    escalation_risk: true
    examples:
      - "@AppleSupport your customer service in the store was absolutely terrible today"
      - "removing the headphone jack was the dumbest idea ever Apple fix this"
      - "worst update in history, so tired of Apple breaking things"

  - name: unknown_other
    display_name: "Unknown / Fallback / Other"
    definition: >
      The message does not contain sufficient information to classify into any
      domain intent, is excessively short or conversational, is a continuation reply,
      or concerns topics outside Apple product support.
    inclusion_criteria:
      - Short greetings or mentions ("@AppleSupport please help", "@AppleSupport")
      - Continuation messages lacking standalone context ("yes I did that already")
      - Ambiguous queries with no clear topical keyword
      - Out-of-scope inquiries
    exclusion_criteria:
      - Any message matching a specific intent above with reasonable confidence
    auto_handle: false
    escalation_risk: false
    examples:
      - "@AppleSupport hello can you DM me"
      - "@AppleSupport https://t.co/xyz123"
      - "ok thanks for the help"

# ============================================================
# Metadata
# ============================================================
metadata:
  brand: AppleSupport
  version: "2.0"
  total_intents: 11
  fallback_intent: unknown_other
  status: candidate_dataset_ready
  notes: >
    Taxonomy Version 2.0. Expanded to 11 grounded intent categories derived from
    corpus exploration of 82,101 AppleSupport candidate conversations.
    Enforces distinct boundaries between software updates, battery performance,
    physical hardware, connectivity, and billing.
